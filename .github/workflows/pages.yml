name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # No build step by design: formica.html is standalone. The site is just
      # that file served as index.html, with the frozen controls alongside it so
      # they stay runnable. Each carries a banner marking it dead; see CONTROLS.md.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp formica.html _site/index.html
          cp formica.html formica-v1.1-legacy.html formica-global-legacy.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
